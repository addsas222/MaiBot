[build-system]
requires = ["setuptools>=80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "MaiBot"
version = "1.2.5"
description = "MaiCore 是一个基于大语言模型的可交互智能体"
requires-python = ">=3.14"
dependencies = [
    "Babel>=2.17.0",
    "aiohttp>=3.14.3",
    "certifi",
    "colorama>=0.4.6",
    "faiss-cpu>=1.11.0",
    "fastapi>=0.116.0",
    "google-genai>=1.39.1",
    "httpx[socks]",
    "jieba>=0.42.1",
    "json-repair>=0.60.1,<0.61",
    "maim-message==0.6.8",
    "maibot-dashboard==1.7.4.dev20260913423",
    "maibot-plugin-sdk>=2.8.0",
    "mcp>=2.0.0",
    "msgpack>=1.2.1",
    "numpy>=2.2.6",
    "openai>=1.95.0,<2.34",
    "pandas>=2.3.1",
    "pillow>=12.3.0",
    "playwright>=1.54.0",
    "pyarrow>=20.0.0",
    "pydantic>=2.11.7",
    "pypinyin>=0.54.0",
    "prompt-toolkit>=3.0.52",
    "python-multipart>=0.0.31",
    "rapidfuzz",
    "rich>=14.0.0",
    "scipy>=1.7.0",
    "sqlalchemy>=2.0.40",
    "sqlmodel>=0.0.24",
    "structlog>=25.4.0",
    "tomlkit>=0.13.3",
    "typing-extensions",
    "uvicorn>=0.35.0",
    "watchfiles>=1.1.1",
    "ahocorasick-rs>=1.0.3",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    # 与 CI 的 ruff-action 固定版本对齐：ruff 0.16 改了 `ruff format --check` 的输出格式，
    # 会让 .github/scripts/check_ruff_format_regressions.py 解析失败（CI 同样钉 0.15.11）。
    "ruff==0.15.11",
    "zstandard",
]


[tool.uv]
index-strategy = "unsafe-best-match"
constraint-dependencies = [
    "cryptography>=50.0.0",
    "idna>=3.15",
    "pyasn1>=0.6.4",
    "pydantic-settings>=2.14.2",
    "pyjwt>=2.13.0",
    "starlette>=1.3.1,<1.4",
    "urllib3>=2.7.0",
]

[[tool.uv.index]]
name = "tsinghua"
url = "https://pypi.tuna.tsinghua.edu.cn/simple"

[[tool.uv.index]]
name = "aliyun"
url = "https://mirrors.aliyun.com/pypi/simple"

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[tool.pytest.ini_options]
pythonpath = [".", "src"]
filterwarnings = [
    "error::DeprecationWarning:src.*",
    "error::UserWarning:src.*",
    "error::FutureWarning:src.*",
    "error::ResourceWarning:src.*",
]

[tool.ruff]

include = ["*.py"]

# 显式钉住 lint/format 目标版本：ruff 会从 requires-python 推断 target-version，
# 运行时基线升到 3.14 后会被推断为 py314，从而按 3.14 风格重排大量既有文件
# （含 src/A_memorix 同步子树，按 MODIFICATION_POLICY.md 不应在本仓改动格式）。
# 代码本身仍按 3.12+ 语法书写，故目标版本与实际支持范围保持一致。
target-version = "py312"

# 行长度设置
line-length = 120

[tool.ruff.lint]
fixable = ["ALL"]
unfixable = []

# 如果一个变量的名称以下划线开头，即使它未被使用，也不应该被视为错误或警告。
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

# 启用的规则
select = [
    "E", # pycodestyle 错误
    "F", # pyflakes
    "B", # flake8-bugbear
]

ignore = ["E711", "E501"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Body", "fastapi.File"]

[tool.ruff.lint.per-file-ignores]
"scripts/run_a_memorix_webui_backend.py" = ["E402"]
"src/plugin_runtime/runner/runner_main.py" = ["E402"]

[tool.ruff.format]
docstring-code-format = true
indent-style = "space"


# 使用双引号表示字符串
quote-style = "double"

# 尊重魔法尾随逗号
# 例如：
# items = [
#     "apple",
#     "banana",
#     "cherry",
# ]
skip-magic-trailing-comma = false

# 自动检测合适的换行符
line-ending = "auto"

